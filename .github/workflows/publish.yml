name: Publish

# Triggers on a GitHub Release being published, not on every push to main
# — publishing is a deliberate, separate action from merging (docs/
# PLAN.md §11, docs/backlog/story-v1.0-release-prep.md's explicit
# deferral of actually running this workflow until the package owner
# creates a release).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC token exchange during `npm publish`)
      # requires a recent npm CLI — pin explicitly rather than trusting
      # whatever ships with actions/setup-node's Node 20.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run verify
      - run: npm publish --provenance --access public
