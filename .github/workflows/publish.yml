name: Publish (manual fallback)

# SUPERSEDED as the normal publish path by .github/workflows/release.yml
# (docs/backlog/adr-v1.1-changesets-publish.md) — Changesets now owns
# publish-on-merge-to-main. This workflow is kept only as a manual
# break-glass path (e.g. a version got published outside Changesets and
# needs a manual re-run) and deliberately no longer has an automatic
# trigger, so it can never race/double-publish against release.yml.
#
# Run it from the Actions tab ("Run workflow") only if you specifically
# need to publish the current package.json version by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC token exchange during `npm publish`)
      # requires a recent npm CLI — pin explicitly rather than trusting
      # whatever ships with actions/setup-node's Node 20.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run verify
      - run: npm publish --provenance --access public
